name: NEPSE Pre-Market Anomaly Scan

on:
  schedule:
    # 10:30 AM NST (Mon–Fri) = 4:45 AM UTC  (NST = UTC+5:45)
    # Runs 30 minutes before market open to surface potential big movers.
    - cron: "45 4 * * 1-5"
  workflow_dispatch:

jobs:
  smart-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run anomaly scanner
        env:
          PYTHONPATH: ${{ github.workspace }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/smart_scan.py
