name: NEPSE Broker Report

on:
  schedule:
    # 8:00 PM NST = 14:15 UTC (Mon–Fri) — floorsheet data published by NEPSE in evening
    - cron: "15 14 * * 0-4"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Stock symbols (comma-separated, e.g. NABIL,NICA)"
        required: false
        type: string

jobs:
  broker-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run broker analysis
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          if [ -n "${{ github.event.inputs.symbols }}" ]; then
            python scripts/broker_analysis.py ${{ github.event.inputs.symbols }}
          else
            python scripts/broker_analysis.py
          fi
