name: NEPSE Telegram Bot

on:
  schedule:
    # Target delivery every 30 min: 11:30 AM → 3:00 PM NST.
    # GH Actions takes ~3 min from trigger to message, so each cron fires 3 min early.
    # NST = UTC+5:45  |  market_open.yml handles the 11:00 AM open summary.
    - cron: "42 5 * * 1-5"   # target: 11:30 AM NST
    - cron: "12 6 * * 1-5"   # target: 12:00 PM NST
    - cron: "42 6 * * 1-5"   # target: 12:30 PM NST
    - cron: "12 7 * * 1-5"   # target:  1:00 PM NST
    - cron: "42 7 * * 1-5"   # target:  1:30 PM NST
    - cron: "12 8 * * 1-5"   # target:  2:00 PM NST
    - cron: "42 8 * * 1-5"   # target:  2:30 PM NST
    - cron: "12 9 * * 1-5"   # target:  3:00 PM NST (closing)
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  send-nepse-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NEPSE bot
        env:
          PYTHONPATH: ${{ github.workspace }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: python scripts/nepse_bot.py
