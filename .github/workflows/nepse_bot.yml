name: NEPSE Telegram Bot

on:
  schedule:
    # Every 30 min from 5:45 AM to 9:15 AM UTC = 11:30 AM to 3:00 PM NST
    # NST = UTC+5:45, so UTC 5:45 = NST 11:30, UTC 9:15 = NST 15:00
    # 11:00 AM open summary is handled by market_open.yml
    - cron: "45 5 * * 1-5"   # 11:30 AM NST
    - cron: "15 6 * * 1-5"   # 12:00 PM NST
    - cron: "45 6 * * 1-5"   # 12:30 PM NST
    - cron: "15 7 * * 1-5"   # 1:00 PM NST
    - cron: "45 7 * * 1-5"   # 1:30 PM NST
    - cron: "15 8 * * 1-5"   # 2:00 PM NST
    - cron: "45 8 * * 1-5"   # 2:30 PM NST
    - cron: "15 9 * * 1-5"   # 3:00 PM NST (closing)
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  send-nepse-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NEPSE bot
        env:
          PYTHONPATH: ${{ github.workspace }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: python scripts/nepse_bot.py
