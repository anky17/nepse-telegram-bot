name: EOD Market Recap

on:
  schedule:
    # Target: 8:00 PM NST. The upstream ShareSansar scraper (omitnomis/ShareSansarScraper,
    # served via GitHub Pages) doesn't actually publish the day's recap until ~12:13-13:50 UTC
    # (17:58-19:35 NST) — running earlier returned the previous day's cached data.
    # NST = UTC+5:45  →  20:00 NST = 14:15 UTC
    - cron: "15 14 * * 1-5"
  workflow_dispatch:

jobs:
  eod-recap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EOD recap
        env:
          PYTHONPATH: ${{ github.workspace }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/eod_recap.py
