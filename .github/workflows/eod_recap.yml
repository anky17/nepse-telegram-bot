name: EOD Market Recap

on:
  schedule:
    # Target: 5:15 PM NST (ShareSansar recap data isn't ready until ~5 PM post-close).
    # NST = UTC+5:45  →  17:15 NST = 11:30 UTC  →  start at 11:27 UTC
    - cron: "27 11 * * 1-5"
  workflow_dispatch:

jobs:
  eod-recap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EOD recap
        env:
          PYTHONPATH: ${{ github.workspace }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/eod_recap.py
