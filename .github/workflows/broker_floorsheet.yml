name: NEPSE Broker Floorsheet Analysis

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Stock symbols (comma-separated, e.g. NABIL,NICA)"
        required: true
        type: string

jobs:
  broker-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run broker analysis
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOLS: ${{ github.event.inputs.symbols }}
        run: python scripts/broker_floorsheet.py
