name: NEPSE Market Open

on:
  schedule:
    # Target: 11:00 AM NST — start 3 min early so the message lands on time.
    # NST = UTC+5:45  →  11:00 NST = 05:15 UTC  →  start at 05:12 UTC
    - cron: "12 5 * * 1-5"
  workflow_dispatch:

jobs:
  market-open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Send market open summary
        env:
          PYTHONPATH: ${{ github.workspace }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: python scripts/market_open.py
